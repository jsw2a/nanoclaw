<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- Seamless Talavera tile: cobalt florals on cream. Corner quarter-flowers
       join across tiles to form whole medallions; edge accents meet too. -->
  <rect width="240" height="240" fill="#f4ecdb"/>

  <!-- thin grid lines like grouted tiles -->
  <g stroke="#cdb98f" stroke-width="2" opacity="0.5">
    <line x1="0" y1="0" x2="240" y2="0"/>
    <line x1="0" y1="240" x2="240" y2="240"/>
    <line x1="0" y1="0" x2="0" y2="240"/>
    <line x1="240" y1="0" x2="240" y2="240"/>
  </g>

  <!-- CENTER medallion -->
  <g fill="#23409e">
    <circle cx="120" cy="120" r="9"/>
    <circle cx="120" cy="120" r="15" fill="none" stroke="#23409e" stroke-width="2.5"/>
    <g>
      <path d="M120 70 C131 92 131 102 120 116 C109 102 109 92 120 70Z"/>
      <path d="M120 170 C131 148 131 138 120 124 C109 138 109 148 120 170Z"/>
      <path d="M70 120 C92 109 102 109 116 120 C102 131 92 131 70 120Z"/>
      <path d="M170 120 C148 109 138 109 124 120 C138 131 148 131 170 120Z"/>
    </g>
    <g transform="rotate(45 120 120)">
      <path d="M120 80 C129 98 129 106 120 117 C111 106 111 98 120 80Z"/>
      <path d="M120 160 C129 142 129 134 120 123 C111 134 111 142 120 160Z"/>
      <path d="M80 120 C98 111 106 111 117 120 C106 129 98 129 80 120Z"/>
      <path d="M160 120 C142 111 134 111 123 120 C134 129 142 129 160 120Z"/>
    </g>
  </g>
  <!-- center accent dots -->
  <g fill="#c2622f">
    <circle cx="120" cy="58" r="4"/>
    <circle cx="120" cy="182" r="4"/>
    <circle cx="58" cy="120" r="4"/>
    <circle cx="182" cy="120" r="4"/>
  </g>

  <!-- CORNER quarter-medallions (form full flowers when 4 tiles meet) -->
  <g fill="#23409e">
    <g>
      <!-- top-left corner -->
      <path d="M0 36 C16 28 24 28 32 0 C20 8 12 16 0 24Z" transform="translate(0,0)"/>
      <path d="M36 0 C28 16 28 24 0 32 C8 20 16 12 24 0Z"/>
      <circle cx="0" cy="0" r="10"/>
    </g>
    <g transform="translate(240,0) scale(-1,1)">
      <path d="M0 36 C16 28 24 28 32 0 C20 8 12 16 0 24Z"/>
      <path d="M36 0 C28 16 28 24 0 32 C8 20 16 12 24 0Z"/>
      <circle cx="0" cy="0" r="10"/>
    </g>
    <g transform="translate(0,240) scale(1,-1)">
      <path d="M0 36 C16 28 24 28 32 0 C20 8 12 16 0 24Z"/>
      <path d="M36 0 C28 16 28 24 0 32 C8 20 16 12 24 0Z"/>
      <circle cx="0" cy="0" r="10"/>
    </g>
    <g transform="translate(240,240) scale(-1,-1)">
      <path d="M0 36 C16 28 24 28 32 0 C20 8 12 16 0 24Z"/>
      <path d="M36 0 C28 16 28 24 0 32 C8 20 16 12 24 0Z"/>
      <circle cx="0" cy="0" r="10"/>
    </g>
  </g>

  <!-- EDGE midpoint half-leaves (meet across tile seams) -->
  <g fill="#23409e" opacity="0.92">
    <path d="M120 0 C112 14 128 14 120 0Z"/>
    <path d="M108 4 C114 16 126 16 132 4 C128 0 112 0 108 4Z"/>
    <g transform="translate(0,240) scale(1,-1)">
      <path d="M108 4 C114 16 126 16 132 4 C128 0 112 0 108 4Z"/>
    </g>
    <g transform="rotate(90 120 120)">
      <path d="M108 4 C114 16 126 16 132 4 C128 0 112 0 108 4Z"/>
    </g>
    <g transform="rotate(-90 120 120)">
      <path d="M108 4 C114 16 126 16 132 4 C128 0 112 0 108 4Z"/>
    </g>
  </g>
</svg>
